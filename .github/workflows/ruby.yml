name: PR Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ruby/**'
      - '.github/workflows/ruby.yml'

permissions:
  contents: read

concurrency:
  group: eng-intern-ruby-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ruby-tests:
    name: Run Ruby Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ruby
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@89f90524b88a01fe6e0b732220432cc6142926af # v1
        with:
          ruby-version: '3.3'
          bundler: default
          bundler-cache: true
          working-directory: ruby

      - run: bundle exec rspec translator.test.rb
