name: PR Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - 'go/**'
      - '.github/workflows/go.yml'

permissions:
  contents: read

concurrency:
  group: eng-intern-go-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  go-tests:
    name: Run Go Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Run Go Tests
        run: go test ./...
